# Allure JUnit5 extension is registered via ServiceLoader; requires autodetection enabled
junit.jupiter.extensions.autodetection.enabled=true

# Enables our ServiceLoader-registered AllureReportListener (auto report generation + cleanup)
junit.platform.listeners.registration.autodetection.enabled=true

# Enable parallel test execution
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default = concurrent

# Default execution mode for top-level classes
junit.jupiter.execution.parallel.mode.default=same_thread

# Run test classes concurrently, methods within a class sequentially
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# Use fixed thread count to limit concurrent test classes
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
junit.jupiter.execution.parallel.config.fixed.max-pool-size=4


